<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roberta Moscatelli — Visual Art & Illustration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f6f3;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8vw;
    }

    .content {
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 10vw, 9rem);
      font-weight: 400;
      line-height: 0.82;
      letter-spacing: -0.06em;
      margin-bottom: 2.5rem;
    }

    .role {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 5rem;
    }

    .statement {
      max-width: 500px;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      line-height: 1.35;
      margin-bottom: 4rem;
    }

    .available {
      max-width: 420px;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    a {
      color: #111111;
      text-decoration: none;
      border-bottom: 1px solid #111111;
      padding-bottom: 3px;
      font-size: 0.85rem;
    }

    a:hover {
      opacity: 0.55;
    }

    @media (max-width: 650px) {
      main {
        padding: 12vw 8vw;
      }

      h1 {
        font-size: clamp(3.5rem, 18vw, 6rem);
      }

      .role {
        margin-bottom: 4rem;
      }

      .statement {
        margin-bottom: 3rem;
      }

      .links {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="content">

      <h1>Roberta<br>Moscatelli</h1>

      <div class="role">
        Visual Art · Illustration
      </div>

      <div class="statement">
        Trabajo entre la ilustración, el arte visual y la narrativa.
      </div>

      <div class="available">
        Disponible para proyectos de ilustración,
        colaboraciones artísticas y encargos.
      </div>

      <div class="links">
        <a href="mailto:me@robertamoscatelli.com">Email</a>

        <a href="https://www.instagram.com/robertamsc.art/" target="_blank">
          Instagram
        </a>

        <a href="https://www.tiktok.com/@roberta_msc" target="_blank">
          TikTok
        </a>
      </div>

    </div>
  </main>

</body>
</html>
