<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roberta Moscatelli — Visual Art & Illustration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f6f3;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 7vw 8vw;
    }

    .content {
      width: 100%;
      max-width: 1050px;
    }

    .identity {
      margin-bottom: 7rem;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.8rem, 8vw, 7.5rem);
      font-weight: 400;
      line-height: 0.86;
      letter-spacing: -0.055em;
      margin-bottom: 1.8rem;
    }

    .role {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .statement {
      max-width: 520px;
      font-size: clamp(1.25rem, 1.8vw, 1.65rem);
      line-height: 1.4;
      margin-bottom: 3.5rem;
    }

    .available {
      max-width: 430px;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2.2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.6rem;
    }

    a {
      color: #111111;
      text-decoration: none;
      border-bottom: 1px solid #111111;
      padding-bottom: 3px;
      font-size: 0.85rem;
    }

    a:hover {
      opacity: 0.5;
    }

    @media (max-width: 650px) {
      main {
        min-height: 100svh;
        align-items: flex-start;
        padding: 12vw 8vw 10vw;
      }

      .identity {
        margin-bottom: 5rem;
      }

      h1 {
        font-size: clamp(3.3rem, 16vw, 5.5rem);
        line-height: 0.9;
        margin-bottom: 1.5rem;
      }

      .statement {
        font-size: 1.25rem;
        margin-bottom: 3rem;
      }

      .available {
        margin-bottom: 2rem;
      }

      .links {
        gap: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="content">

      <div class="identity">
        <h1>Roberta<br>Moscatelli</h1>

        <div class="role">
          Visual Art · Illustration
        </div>
      </div>

      <div class="statement">
        Trabajo entre la ilustración, el arte visual y la narrativa.
      </div>

      <div class="available">
        Disponible para proyectos de ilustración,
        colaboraciones artísticas y encargos.
      </div>

<div class="links">

</div>
    </div>
  </main>

</html>
